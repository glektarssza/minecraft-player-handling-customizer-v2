# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
version: 2
updates:
  - directory: /
    package-ecosystem: gradle
    patterns: ['*']
    ignore:
      - dependency-name: 'gradle-wrapper'
    labels:
      - Dependency
    assignees:
      - glektarssza
    commit-message:
      include: scope
      prefix: '[Dependabot] '
    pull-request-branch-name:
      separator: /
    rebase-strategy: auto
    target-branch: main
    schedule:
      interval: weekly
      day: wednesday
      time: '12:00'
      timezone: Canada/Mountain
  - directory: ./.github/
    package-ecosystem: github-actions
    patterns: ['*']
    labels:
      - Dependency
    assignees:
      - glektarssza
    commit-message:
      include: scope
      prefix: '[Dependabot] '
    pull-request-branch-name:
      separator: /
    rebase-strategy: auto
    target-branch: main
    schedule:
      interval: weekly
      day: wednesday
      time: '12:00'
      timezone: Canada/Mountain
